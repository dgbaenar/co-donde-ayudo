[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["uv run --no-sync alembic -c src/alembic/alembic.ini upgrade head"]
startCommand = "uv run --no-sync donde-ayudo"
healthcheckPath = "/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
