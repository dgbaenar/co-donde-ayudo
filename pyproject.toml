[project]
name = "co-donde-ayudo"
version = "0.1.0"
description = "Aplicación web para coordinar ayuda ciudadana"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "nicegui==3.15.0",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.51",
]

[project.scripts]
donde-ayudo = "frontend.runtime:run"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/frontend"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
